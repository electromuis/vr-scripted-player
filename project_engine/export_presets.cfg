; Export presets used by CI (.github/workflows/build.yml) and build_and_run.bat.
; Output paths are passed on the command line, so export_path stays empty.
; Android signing comes from the GODOT_ANDROID_KEYSTORE_* environment variables.
; Windows / Linux pack the gde_gozen library into the .pck instead of shipping
; it next to the executable (player/runtime/gozen_loader.gd loads it).

[preset.0]

name="Windows Desktop"
platform="Windows Desktop"
runnable=true
dedicated_server=false
custom_features=""
export_filter="all_resources"
include_filter="addons/gde_gozen/bin/libgozen.windows.template_release.x86_64.dll"
exclude_filter="tests/*, docs/*, addons/gde_gozen/gozen.gdextension"
export_path=""
encryption_include_filters=""
encryption_exclude_filters=""
encrypt_pck=false
encrypt_directory=false
script_export_mode=2

[preset.0.options]

custom_template/debug=""
custom_template/release=""
debug/export_console_wrapper=1
binary_format/embed_pck=true
texture_format/s3tc_bptc=true
texture_format/etc2_astc=false
binary_format/architecture="x86_64"
codesign/enable=false
application/modify_resources=false
application/company_name="Electromuis"
application/product_name="Shader Player VR"
application/file_description="Scripted VJ video player"

