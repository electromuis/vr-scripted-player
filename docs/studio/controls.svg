19' stroke='#2c3344'/><text x='60' y='253' fill='#e8ebf2' font-size='15' text-anchor='start' font-weight='400'>Volume</text><rect x='360' y='232' width='270' height='30' rx='8' fill='#1d2230' stroke='#2c3344'/><text x='375' y='252' fill='#e8ebf2' font-size='13' text-anchor='start' font-weight='400'>Left stick ↑ / ↓</text><rect x='42' y='278' width='600' height='46' rx='10' fill='#1d2433' stroke='#4cc9f0'/><text x='60' y='307' fill='#e8ebf2' font-size='15' text-anchor='start' font-weight='400'>Next video</text><rect x='360' y='286' width='270' height='30' rx='8' fill='#4cc9f0'/><text x='495' y='306' fill='#06121a' font-size='13' text-anchor='middle' font-weight='700'>Press a button… (B to keep)</text><rect x='42' y='332' width='600' height='46' rx='10' fill='#0f1219' stroke='#2c3344'/><text x='60' y='361' fill='#e8ebf2' font-size='15' text-anchor='start' font-weight='400'>Reset view</text><rect x='360' y='340' width='270' height='30' rx='8' fill='#1d2230' stroke='#2c3344'/><text x='375' y='360' fill='#e8ebf2' font-size='13' text-anchor='start' font-weight='400'>Right stick click</text><rect x='42' y='386' width='600' height='46' rx='10' fill='#0f1219' stroke='#2c3344'/><text x='60' y='415' fill='#e8ebf2' font-size='15' text-anchor='start' font-weight='400'>Open menu</text><rect x='360' y='394' width='270' height='30' rx='8' fill='#1d2230' stroke='#2c3344'/><text x='375' y='414' fill='#e8ebf2' font-size='13' text-anchor='start' font-weight='400'>Left ≡</text><rect x='42' y='440' width='600' height='46' rx='10' fill='#0f1219' stroke='#2c3344'/><text x='60' y='469' fill='#e8ebf2' font-size='15' text-anchor='start' font-weight='400'>Toggle Camera FX</text><rect x='360' y='448' width='270' height='30' rx='8' fill='#1d2230' stroke='#2c3344'/><text x='375' y='468' fill='#8c95a8' font-size='13' text-anchor='start' font-weight='400'>— unbound —</text><rect x='42' y='494' width='600' height='46' rx='10' fill='#0f1219' stroke='#2c3344'/><text x='60' y='523' fill='#e8ebf2' font-