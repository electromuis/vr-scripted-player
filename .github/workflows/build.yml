name: Build

# Every push and PR: run the tests, export and package all platforms, upload
# the packages as workflow artifacts. gde_gozen isn't built here: its binaries
# come from a release of our fork (GOZEN_REPO @ GOZEN_RELEASE), which that
# repo's release workflow builds.
# A pushed tag (v1.2.3): the same, plus a GitHub release with the packages and
# the commit messages since the previous tag.

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  GODOT_VERSION: "4.7.2"
  # gde_gozen binaries: a release of our fork (see its release workflow; push
  # a v* tag there to publish one). The fork is private, so reading it takes
  # the GOZEN_TOKEN secret: a token with read access to its contents.
  GOZEN_REPO: electromuis/gde_gozen
  GOZEN_RELEASE: v9.7-sp1

jobs:
  test:
    name: Tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Set up Godot and addons
        env:
          GH_TOKEN: ${{ secrets.GOZEN_TOKEN || github.token }}
        run: |
          ci/fetch_gozen.sh linux-x86_64
          ci/setup_godot.sh
          ci/fetch_addons.sh
      - name: Import project
        run: ~/godot/godot --headless --path project_engine --import
      - name: gde_gozen loads (GoZenVideo, AudioStreamFFmpeg)
        run: ~/godot/godot --headless --path project_engine --script res://tests/check_extensions.gd
      - name: Unit tests
        run: ~/godot/godot --headless --path project_engine --script res://tests/run.gd

  package:
    name: Export and package
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
            # Windows and macOS only take digits and dots (1.2.0-beta -> 1.2.0).
            sed -i "s|^config/version=.*|config/version=\"${VERSION%%[-+]*}\"|" project_engine/project.godot
          else
            BASE="$(grep -Po '^config/version="\K[^"]+' project_engine/project.godot)"
            VERSION="${BASE%-dev}-dev.${GITHUB_SHA::7}"  # 0.1.0-dev -> 0.1.0-dev.abc1234
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          # Android wants a numeric, increasing versionCode and a plain versionName.
          sed -i "/^\[preset.3.options\]/a version/code=${GITHUB_RUN_NUMBER}\nversion/name=\"$VERSION\"" project_engine/export_presets.cfg

      - name: Fetch gde_gozen binaries
        env:
          GH_TOKEN: ${{ secrets.GOZEN_TOKEN || github.token }}
        run: ci/fetch_gozen.sh linux-x86_64 windows-x86_64 macos-arm64 macos-x86_64 android-arm64

      - name: Restore Godot export templates
        uses: actions/cache@v4
        with:
          path: ~/.local/share/godot/export_templates
          key: godot-templates-${{ env.GODOT_VERSION }}-v1

      - name: Set up Godot, templates and addons
        run: |
          ci/setup_godot.sh --templates
          ci/fetch_addons.sh
          sudo apt-get update && sudo apt-get install -y nsis
          ls -la project_engine/addons/gde_gozen/bin

      - name: Import project
        run: ~/godot/godot --headless --path project_engine --import

      - name: Export desktop builds
        run: |
          export_one() {  # preset, output file
            mkdir -p "$(dirname "$2")"
            ~/godot/godot --headless --path project_engine --export-release "$1" "$2"
            [ -f "$2" ] || { echo "::error::$1 export produced no $2"; exit 1; }
          }
          export_one "Windows Desktop" "$PWD/build/windows/ShaderPlayerVR.exe"
          export_one "Linux" "$PWD/build/linux/ShaderPlayerVR.x86_64"
          export_one "macOS" "$PWD/build/macos/ShaderPlayerVR.zip"
          ls -laR build
          # gde_gozen is packed into the .pck on Windows / Linux, never shipped loose.
          if [ -n "$(find build/windows build/linux -iname '*gozen*')" ]; then
            echo "::error::gde_gozen library exported next to the executable"; exit 1
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Export Quest 3 build
        env:
          GODOT_ANDROID_KEYSTORE_RELEASE_USER: ${{ secrets.ANDROID_KEYSTORE_USER }}
          GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          # Signing key: the repo's secrets if set, else a throwaway one (the APK
          # then won't install over one signed with a different key).
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
          else
            echo "::warning::ANDROID_KEYSTORE_* secrets not set; signing the Quest APK with a throwaway key."
            export GODOT_ANDROID_KEYSTORE_RELEASE_USER=ci GODOT_ANDROID_KEYSTORE_RELEASE_PASSWORD=ci-password
            keytool -genkeypair -keystore "$RUNNER_TEMP/release.keystore" -alias ci -keyalg RSA -keysize 2048 \
              -validity 10000 -storepass ci-password -keypass ci-password -dname "CN=Shader Player VR CI" -noprompt
          fi
          export GODOT_ANDROID_KEYSTORE_RELEASE_PATH="$RUNNER_TEMP/release.keystore"

          ci/fetch_addons.sh --android
          ~/godot/godot --headless --path project_engine --import
          mkdir -p build/quest
          ~/godot/godot --headless --path project_engine --install-android-build-template \
            --export-release "Quest 3" "$PWD/build/quest/ShaderPlayerVR.apk"
          [ -f build/quest/ShaderPlayerVR.apk ] || { echo "::error::Quest 3 export produced no APK"; exit 1; }

      - name: Package
        run: ci/package.sh "${{ steps.version.outputs.version }}"

      # One artifact per package, uploaded as the file itself (not zipped).
      - name: Upload Windows installer
        uses: actions/upload-artifact@v7
        with:
          path: dist/ShaderPlayerVR-${{ steps.version.outputs.version }}-windows-x86_64-setup.exe
          archive: false
          if-no-files-found: error
      - name: Upload Windows portable
        uses: actions/upload-artifact@v7
        with:
          path: dist/ShaderPlayerVR-${{ steps.version.outputs.version }}-windows-x86_64-portable.zip
          archive: false
          if-no-files-found: error
      - name: Upload Linux .deb
        uses: actions/upload-artifact@v7
        with:
          path: dist/ShaderPlayerVR-${{ steps.version.outputs.version }}-linux-x86_64.deb
          archive: false
          if-no-files-found: error
      - name: Upload Linux portable
        uses: actions/upload-artifact@v7
        with:
          path: dist/ShaderPlayerVR-${{ steps.version.outputs.version }}-linux-x86_64-portable.tar.gz
          archive: false
          if-no-files-found: error
      - name: Upload macOS
        uses: actions/upload-artifact@v7
        with:
          path: dist/ShaderPlayerVR-${{ steps.version.outputs.version }}-macos-universal.zip
          archive: false
          if-no-files-found: error
      - name: Upload Quest 3
        uses: actions/upload-artifact@v7
        with:
          path: dist/ShaderPlayerVR-${{ steps.version.outputs.version }}-quest3.apk
          archive: false
          if-no-files-found: error
      - name: Upload All platforms portable
        uses: actions/upload-artifact@v7
        with:
          path: dist/ShaderPlayerVR-${{ steps.version.outputs.version }}-portable-all-platforms.zip
          archive: false
          if-no-files-found: error

  release:
    name: GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Release notes from commits since the previous tag
        run: |
          git fetch --force --tags origin
          PREV="$(git describe --tags --abbrev=0 --match 'v*' "${GITHUB_REF_NAME}^" 2>/dev/null || true)"
          RANGE="${PREV:+$PREV..}$GITHUB_REF_NAME"
          {
            if [ -n "$PREV" ]; then echo "## Changes since $PREV"; else echo "## Changes"; fi
            echo
            git log --no-merges --pretty=format:'- %s (%h)%n%w(0,2,2)%b' "$RANGE" | sed '/^\s*$/d'
          } > release_notes.md
          cat release_notes.md

      - uses: actions/download-artifact@v8
        with:
          pattern: ShaderPlayerVR-${{ needs.package.outputs.version }}-*
          path: dist
          merge-multiple: true

      - run: ls -la dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Shader Player VR ${{ github.ref_name }}
          body_path: release_notes.md
          files: dist/*
          prerelease: ${{ contains(github.ref_name, '-') }}
